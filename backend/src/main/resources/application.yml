spring:
  application:
    name: payroute-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# PayRoute Custom Configs
payroute:
  routing:
    default-strategy: PRIORITY
    max-retry-attempts: 3
    retry-base-delay-ms: 200
  circuit-breaker:
    failure-rate-threshold: 50.0
    slow-call-rate-threshold: 75.0
    slow-call-duration-threshold-ms: 1000
    sliding-window-size: 10
    minimum-number-of-calls: 4
    wait-duration-in-open-state-ms: 15000
    permitted-number-of-calls-in-half-open: 2
  kafka:
    enabled: true
    topic: payroute.payment.events
  cache:
    ttl-seconds: 300
